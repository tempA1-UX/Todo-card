<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="stylesheet" href="edit.css">
<title>Advanced Todo Card</title>

</head>
<body>
<article data-testid="test-todo-card" id="card">

<div class="wrapper">
<div class="indicator" id="priorityIndicator" data-testid="test-todo-priority-indicator"></div>

<!-- HEADER -->
<div class="row">
  <div class="left">
    <input type="checkbox" id="check" data-testid="test-todo-complete-toggle"/>
    <span data-testid="test-todo-status" id="status">Pending</span>
  </div>

  <select id="statusControl" data-testid="test-todo-status-control">
    <option>Pending</option>
    <option>In Progress</option>
    <option>Done</option>
  </select>
</div>

<h2 data-testid="test-todo-title"></h2>

<div 
  id="descSection"
  data-testid="test-todo-collapsible-section"
  class="collapsed"
>
  <p data-testid="test-todo-description"></p>
</div>

<button id="expandBtn" data-testid="test-todo-expand-toggle"
aria-expanded="false">Expand</button>

<span class="badge" data-testid="test-todo-priority" id="priority"></span>

<p>
  <time data-testid="test-todo-due-date" id="dueDate"></time>
</p>

<p id="timeRemaining" data-testid="test-todo-time-remaining" aria-live="polite"></p>

<p id="overdue" data-testid="test-todo-overdue-indicator"></p>

<div class="tags" data-testid="test-todo-tags">
  <span class="tag" data-testid="test-todo-tag-work">Work</span>
  <span class="tag" data-testid="test-todo-tag-urgent">Urgent</span>
</div>

<div class="row" style="margin-top:10px;">
  <div></div>
  <div>
    <button class="edi" data-testid="test-todo-edit-button" id="editBtn">Edit</button>
    <button class="del" data-testid="test-todo-delete-button" onclick="alert('Delete clicked')">Delete</button>
  </div>
</div>

<!-- EDIT FORM -->
<form id="editForm" data-testid="test-todo-edit-form">
  <label>Title</label>
  <input id="editTitle" data-testid="test-todo-edit-title-input"/>

  <label>Description</label>
  <textarea id="editDesc" data-testid="test-todo-edit-description-input"></textarea>

  <label>Priority</label>
  <select id="editPriority" data-testid="test-todo-edit-priority-select">
    <option>Low</option>
    <option>Medium</option>
    <option>High</option>
  </select>

  <label>Due Date</label>
  <input type="datetime-local" id="editDate" data-testid="test-todo-edit-due-date-input"/>

  <button type="button" id="saveBtn" data-testid="test-todo-save-button">Save</button>
  <button type="button" id="cancelBtn" data-testid="test-todo-cancel-button">Cancel</button>
</form>

</div>
</article>


<script src="file.js"></script>

</body>
</html>
