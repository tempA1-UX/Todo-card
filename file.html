<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
    <title>Todo Card</title>
</head>
<body>
    
<article data-testid="test-todo-card">

  
  <h2 data-testid="test-todo-title">Finish Frontend Task</h2>

  <p data-testid="test-todo-description">
    Build a testable and accessible todo card component.
  </p>

  <span 
    class="badge high" 
    data-testid="test-todo-priority"
    aria-label="High Priority"
  >
    High
  </span>

  <span 
    data-testid="test-todo-status"
    id="status"
  >
    Pending
  </span>

  <p>
    <time 
      data-testid="test-todo-due-date"
      datetime="2026-04-16T18:00:00Z"
    >
      Due April 16, 2026
    </time>
  </p>

  <p 
    data-testid="test-todo-time-remaining"
    id="timeRemaining"
  >
    Calculating...
  </p>

  <div 
    class="tags" 
    role="list"
    data-testid="test-todo-tags"
  >
    <span class="tag" data-testid="test-todo-tag-work">Work</span>
    <span class="tag" data-testid="test-todo-tag-urgent">Urgent</span>
  </div>

  <label>
    <input 
      type="checkbox" 
      data-testid="test-todo-complete-toggle"
      onchange="toggleDone(this)"
    />
    Mark as complete   
  </label>

<div class="action">
    <button 
    class="edi"
    data-testid="test-todo-edit-button"
    onclick="console.log('edit clicked')"
  >
    Edit
  </button>

  <button 
    class="del"
    data-testid="test-todo-delete-button"
    onclick="alert('Delete clicked')"
  >
    Delete
  </button>
</div>

</article>
</body>
</html>
